 <figure class="card">
        <div class="card__emoji">{%image%}</div>

        <div class="card__title-box">
          <h2 class="card__title">{%product-name%}</h2>
        </div>

        <div class="card__details">
          <div class="card__detail-box">
            <h6 class="card__detail card__detail--organic {%notOrganic%}">Organic!</h6>
          </div>

          <div class="card__detail-box">
            <h6 class="card__detail"> {%quantity%}</h6>
          </div>

          <div class="card__detail-box">
            <h6 class="card__detail card__detail--price">{%price%}</h6>
          </div>
        </div>

        <a class="card__link" href="/product?id={%id%}">
          <span>Detail <i class="emoji-right">👉</i></span>
        </a>
      </figure>
